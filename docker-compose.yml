services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mysql_study}
      MYSQL_DATABASE: ecommerce
    ports:
      - "3308:3306"  # host 3308 -> avoids clashing with a local MySQL install on 3306
    volumes:
      - mysql_data:/var/lib/mysql
      - ./data/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./data/02_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-mysql_study}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - mysql

volumes:
  mysql_data:
